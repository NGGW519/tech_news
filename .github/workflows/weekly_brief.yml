# 주간 테크 뉴스 브리핑 (SPEC 2절 실행 사양)
name: weekly-brief

on:
  schedule:
    - cron: '10 23 * * 0'   # UTC 일 23:10 = KST 월 08:10 (지연 감안해 20분 당김)
  workflow_dispatch:         # 수동 실행 · 실패한 주 복구용 (비월요일 실행은 그 주 월요일로 스냅된다)

permissions:
  contents: write            # 실행 로그 커밋 (SPEC 9절 60일 비활성화 대응)

concurrency:
  group: weekly-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run weekly brief
        id: run
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
          NOTION_USER_ID: ${{ secrets.NOTION_USER_ID }}
        run: python -m src.main

      - name: Commit run log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/last_run.txt || true
          git commit -m "run log: $(date -u +%Y-%m-%d)" || echo "no log changes"
          git push
