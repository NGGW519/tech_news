[pytest]
testpaths = tests

# 이 머신에는 ROS 2(Humble)가 apt 로 깔려 있고, 그 pytest 플러그인들이 pytest11 엔트리포인트로
# 전역 자동 로드된다. launch_testing 은 pytest 9 에서 제거된 hook 시그니처(`path` 인자)를
# 아직 쓰고 있어 pytest 자체가 뜨지 않는다. 이 프로젝트와 무관한 플러그인이므로 전부 끈다.
addopts =
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_copyright
    -p no:ament_xmllint
    -p no:ament_lint
    -p no:ament_pep257
    -p no:ament_flake8
    -p no:colcon_core_warnings_stderr
